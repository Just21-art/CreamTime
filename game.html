<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CreamTime</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial; touch-action:none; }
  canvas { display:block; }
  #hud { position:absolute; top:15px; left:15px; color:#fff; z-index:10; display:none; font-size:18px; font-weight:bold; }
  #task { position:absolute; top:45px; left:15px; color:#ffaa00; z-index:10; display:none; font-size:16px; font-weight:bold; }
  #joy { position:absolute; bottom:80px; left:30px; width:140px; height:140px; z-index:20; display:none; }
  .jbtn { position:absolute; width:45px; height:45px; background:rgba(255,255,255,0.2); border:2px solid #fff; border-radius:8px; color:#fff; font-size:20px; text-align:center; line-height:45px; user-select:none; }
  .jup { left:47px; top:0; } .jdown { left:47px; bottom:0; } .jleft { left:0; top:47px; } .jright { right:0; top:47px; }
  #runBtn { position:absolute; bottom:90px; right:30px; width:80px; height:80px; border-radius:50%; background:rgba(255,51,51,0.4); border:3px solid #ff3333; color:#fff; font-weight:bold; display:none; align-items:center; justify-content:center; z-index:20; }
  #look { position:absolute; top:0; right:0; width:50%; height:100%; z-index:15; display:none; }
  #actBtn { position:absolute; bottom:190px; left:50%; transform:translateX(-50%); padding:15px 30px; background:#ffaa00; color:#000; border:3px solid #fff; border-radius:10px; font-weight:bold; font-size:18px; display:none; z-index:30; }
</style>
</head>
<body>
<div id="hud">Глава 1: Заброшенная фабрика</div>
<div id="task">Предохранители: 0/3</div>
<div id="look"></div>
<div id="joy">
  <div class="jbtn jup" data-dir="up">▲</div>
  <div class="jbtn jdown" data-dir="down">▼</div>
  <div class="jbtn jleft" data-dir="left">◀</div>
  <div class="jbtn jright" data-dir="right">▶</div>
</div>
<div id="runBtn">БЕГ</div>
<button id="actBtn">ДЕЙСТВИЕ</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  var scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); 
scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

var camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 10); camera.rotation.order = 'YXZ';

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
var sun = new THREE.DirectionalLight(0xffffff, 1); sun.position.set(10,20,10); scene.add(sun);
var light1 = new THREE.PointLight(0xffaa00, 1.5, 30); light1.position.set(0, 4, -20); scene.add(light1);
var light2 = new THREE.PointLight(0xff0000, 2, 30); light2.position.set(0, 4, -60); scene.add(light2); 

var canvas = document.createElement('canvas');
canvas.width = 64; canvas.height = 64;
var ctx = canvas.getContext('2d');
ctx.fillStyle = '#444'; ctx.fillRect(0, 0, 64, 64);
ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.strokeRect(0, 0, 64, 64);
var texture = new THREE.CanvasTexture(canvas);
texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
texture.repeat.set(5, 20); 

var floorMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
var wallMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });

var grass = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color:0x4CAF50}));
grass.rotation.x = -Math.PI/2; grass.position.y = -0.1; scene.add(grass);
var road = new THREE.Mesh(new THREE.PlaneGeometry(6,100), new THREE.MeshStandardMaterial({color:0x555555}));
road.rotation.x = -Math.PI/2; scene.add(road);
var factory = new THREE.Mesh(new THREE.BoxGeometry(12,8,10), new THREE.MeshStandardMaterial({color:0x8B4513}));
factory.position.set(0,4,-5); scene.add(factory);
var frontDoor = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), new THREE.MeshStandardMaterial({color:0x222222}));
frontDoor.position.set(0,2,0.1); scene.add(frontDoor);

var floor1 = new THREE.Mesh(new THREE.PlaneGeometry(10,40), floorMat); floor1.rotation.x = -Math.PI/2; floor1.position.z = -20; scene.add(floor1);
var ceil1 = new THREE.Mesh(new THREE.PlaneGeometry(10,40), wallMat); ceil1.rotation.x = Math.PI/2; ceil1.position.y = 5; ceil1.position.z = -20; scene.add(ceil1);

var lWall1 = new THREE.Mesh(new THREE.PlaneGeometry(40,5), wallMat); lWall1.rotation.y = Math.PI/2; lWall1.position.set(-5,2.5,-20); scene.add(lWall1);
var rWall1 = new THREE.Mesh(new THREE.PlaneGeometry(40,5), wallMat); rWall1.rotation.y = -Math.PI/2; rWall1.position.set(5,2.5,-20); scene.add(rWall1);
var bWall1 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); bWall1.position.set(0,2.5,-40); scene.add(bWall1);

var divider = new THREE.Mesh(new THREE.PlaneGeometry(12,5), new THREE.MeshStandardMaterial({color:0x2a2a2a}));
divider.position.set(0, 2.5, 0); scene.add(divider);

var endDoor = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), new THREE.MeshStandardMaterial({color:0x111111}));
endDoor.position.set(0,2,-39.8); scene.add(endDoor);
var doorOpen = false;

var boxMat = new THREE.MeshStandardMaterial({color:0x5c3a21});
var table = new THREE.Mesh(new THREE.BoxGeometry(2,0.1,1), boxMat); table.position.set(-2,1.0,-25); scene.add(table);
[[-2.9,-24.6],[-1.1,-24.6],[-2.9,-25.4],[-1.1,-25.4]].forEach(function(p){
  var leg = new THREE.Mesh(new THREE.BoxGeometry(0.1,1,0.1), boxMat); leg.position.set(p[0],0.5,p[1]); scene.add(leg);
});
var note = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.02,0.3), new THREE.MeshStandardMaterial({color:0xffff99,emissive:0x333300}));
note.position.set(-2,1.06,-25); scene.add(note);

var fuseMat = new THREE.MeshStandardMaterial({color:0xffff00,emissive:0xffff00});
var fuses = [];
[[-3.5,-10],[3.5,-15],[-3.5,-30]].forEach(function(p){
  var f = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4), fuseMat); f.position.set(p[0],0.5,p[1]); scene.add(f); fuses.push(f);
});
var collected = 0;

var floor2a = new THREE.Mesh(new THREE.PlaneGeometry(10,10), floorMat); floor2a.rotation.x = -Math.PI/2; floor2a.position.set(0, 0, -50); scene.add(floor2a);
var floor2b = new THREE.Mesh(new THREE.PlaneGeometry(10,10), floorMat); floor2b.rotation.x = -Math.PI/2; floor2b.position.set(0, 0, -70); scene.add(floor2b);
var bridge = new THREE.Mesh(new THREE.PlaneGeometry(3,10), new THREE.MeshStandardMaterial({color:0x8B4513}));
bridge.rotation.x = -Math.PI/2; bridge.position.set(0, 0.1, -60); scene.add(bridge);

var lWall2 = new THREE.Mesh(new THREE.PlaneGeometry(40,5), wallMat); lWall2.rotation.y = Math.PI/2; lWall2.position.set(-5,2.5,-60); scene.add(lWall2);
var rWall2 = new THREE.Mesh(new THREE.PlaneGeometry(40,5), wallMat); rWall2.rotation.y = -Math.PI/2; rWall2.position.set(5,2.5,-60); scene.add(rWall2);
var ceil2 = new THREE.Mesh(new THREE.PlaneGeometry(10,40), wallMat); ceil2.rotation.x = Math.PI/2; ceil2.position.y = 5; ceil2.position.z = -60; scene.add(ceil2);
var bWall2 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); bWall2.position.set(0,2.5,-80); scene.add(bWall2);

var exitDoor = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), new THREE.MeshStandardMaterial({color:0x00ff00}));
exitDoor.position.set(0,2,-79.8); scene.add(exitDoor);

var monster = new THREE.Group();
var mBody = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshStandardMaterial({color:0xeeeeee})); mBody.position.y=1; monster.add(mBody);
var mHead = new THREE.Mesh(new THREE.BoxGeometry(1.2,1,1.2), new THREE.MeshStandardMaterial({color:0xff9999})); mHead.position.y=2.5; monster.add(mHead);
var eyeMat = new THREE.MeshStandardMaterial({color:0});
var e1 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), eyeMat); e1.position.set(-0.3,2.6,0.61); monster.add(e1);
var e2 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), eyeMat); e2.position.set(0.3,2.6,0.61); monster.add(e2);
monster.position.set(-4,0,-2); monster.visible=false; scene.add(monster);

var moveF=false, moveB=false, moveL=false, moveR=false, isRun=false;
var speed=3, runSpeed=6, inside=false, noteRead=false, mActive=false, won=false, cameraSens=0.005;
var inRoom2 = false;

document.getElementById('joy').style.display = 'block';
document.getElementById('look').style.display = 'block';
document.getElementById('runBtn').style.display = 'flex';
document.getElementById('hud').style.display = 'block';
document.getElementById('task').style.display = 'block';

document.querySelectorAll('.jbtn').forEach(function(b){
  var d = b.getAttribute('data-dir');
  b.addEventListener('touchstart', function(e){ e.preventDefault();
    if(d==='up')moveF=true; if(d==='down')moveB=true; if(d==='left')moveL=true; if(d==='right')moveR=true;
  }, {passive:false});
  b.addEventListener('touchend', function(e){ e.preventDefault();
    if(d==='up')moveF=false; if(d==='down')moveB=false; if(d==='left')moveL=false; if(d==='right')moveR=false;
  }, {passive:false});
});

var rBtn = document.getElementById('runBtn');
rBtn.addEventListener('touchstart', function(e){ e.preventDefault(); isRun=true; }, {passive:false});
rBtn.addEventListener('touchend', function(e){ e.preventDefault(); isRun=false; }, {passive:false});

var look = document.getElementById('look');
var lx=0, ly=0;
look.addEventListener('touchstart', function(e){ lx=e.touches[0].clientX; ly=e.touches[0].clientY; }, {passive:false});
look.addEventListener('touchmove', function(e){
  e.preventDefault();
  camera.rotation.y -= (e.touches[0].clientX - lx) * cameraSens;
  camera.rotation.x -= (e.touches[0].clientY - ly) * cameraSens;
  camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
  lx = e.touches[0].clientX; ly = e.touches[0].clientY;
}, {passive:false});

var actBtn = document.getElementById('actBtn');
actBtn.onclick = function() {
  if(!inside && camera.position.z>2) { inside=true; camera.position.set(0,1.6,-2); actBtn.style.display='none'; }
  else if(inside && !noteRead && Math.hypot(camera.position.x+2, camera.position.z+25)<2) {
    document.getElementById('modal').style.display='flex'; noteRead=true; actBtn.style.display='none';
  }
  else if(inside && collected===3 && !doorOpen && camera.position.z<-36) {
    doorOpen=true; endDoor.position.z=-39.9; mActive=true; monster.visible=true; actBtn.style.display='none';
    inRoom2 = true;
    document.getElementById('task').innerText = "Замани Мороженосчика в обрыв!";
  }
};

var clock = new THREE.Clock();
function animate() {
  if(won) return;
  requestAnimationFrame(animate);
  
  var delta = clock.getDelta();
  var sp = isRun ? runSpeed : speed;
  var dir = new THREE.Vector3(); camera.getWorldDirection(dir);
  var right = new THREE.Vector3(); right.crossVectors(camera.up, dir).normalize();

  var oldX = camera.position.x;
  var oldZ = camera.position.z;

  if(moveF){ camera.position.x+=dir.x*sp*delta; camera.position.z+=dir.z*sp*delta; }
  if(moveB){ camera.position.x-=dir.x*sp*delta; camera.position.z-=dir.z*sp*delta; }
  if(moveL){ camera.position.x-=right.x*sp*delta; camera.position.z-=right.z*sp*delta; }
  if(moveR){ camera.position.x+=right.x*sp*delta; camera.position.z+=right.z*sp*delta; }

  if(inside){
    if(camera.position.x > 4.5 || camera.position.x < -4.5) camera.position.x = oldX;
    if (!inRoom2) {
      if(camera.position.z > -1 || camera.position.z < -39) camera.position.z = oldZ;
    } else {
      if(camera.position.z > -40 || camera.position.z < -79) camera.position.z = oldZ;
      if (camera.position.z < -55 && camera.position.z > -65) {
         if (camera.position.x < -1.5 || camera.position.x > 1.5) {
           alert("Вы упали в обрыв! Игра окончена.");
           location.reload();
         }
      }
    }
  } else {
    if(camera.position.x > 4 || camera.position.x < -4) camera.position.x = oldX;
    if(camera.position.z > 15 || camera.position.z < 1) camera.position.z = oldZ;
  }

  if(!inside && camera.position.z<3) { actBtn.innerText="🚪 ВОЙТИ"; actBtn.style.display='block'; }
  else if(inside && !noteRead && Math.hypot(camera.position.x+2, camera.position.z+25)<2) { actBtn.innerText="📜 ПРОЧИТАТЬ"; actBtn.style.display='block'; }
  else if(inside && collected===3 && !doorOpen && camera.position.z<-36) { actBtn.innerText="🔓 ОТКРЫТЬ ДВЕРЬ"; actBtn.style.display='block'; }
  else { actBtn.style.display='none'; }

  if(inside && collected<3) {
    for(var i=fuses.length-1; i>=0; i--){
      var f = fuses[i];
      if(Math.hypot(camera.position.x-f.position.x, camera.position.z-f.position.z)<1.5) {
        scene.remove(f); fuses.splice(i,1); collected++;
        document.getElementById('task').innerText = "Предохранители: " + collected + "/3";
      }
    }
  }

  if(inRoom2 && camera.position.z < -78) {
    won = true;
    document.getElementById('win').style.display='flex';
    document.getElementById('joy').style.display='none';
    document.getElementById('look').style.display='none';
    document.getElementById('runBtn').style.display='none';
    actBtn.style.display='none';
  }

  if(mActive && monster.visible){
    var mDir = new THREE.Vector3(camera.position.x-monster.position.x, 0, camera.position.z-monster.position.z).normalize();
    monster.position.x += mDir.x * 3.5 * delta;
    monster.position.z += mDir.z * 3.5 * delta;
    monster.lookAt(camera.position.x, 0, camera.position.z);
    
    if (monster.position.z < -55 && monster.position.z > -65) {
      if (monster.position.x < -1.5 || monster.position.x > 1.5) {
          monster.visible = false;
          mActive = false;
          document.getElementById('task').innerText = "Мороженосчик упал! Бегите к выходу!";
          alert("Вы сбросили Мороженосчика в обрыв! Бегите к зеленой двери.");
      }
    }
    
    if(Math.hypot(camera.position.x-monster.position.x, camera.position.z-monster.position.z)<1.5) {
      alert("Вас поймал Мороженосчик!"); location.reload();
    }
  }
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
