<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CreamTime 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; touch-action: none; }
        canvas { display: block; }
        #hud { position: absolute; top: 15px; left: 15px; color: #fff; z-index: 10; pointer-events: none; text-shadow: 1px 1px 3px #000; display: none; }
        #task { position: absolute; top: 45px; left: 15px; color: #ffaa00; z-index: 10; pointer-events: none; text-shadow: 1px 1px 3px #000; display: none; }
        
        #joy { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; z-index: 20; display: none; }
        .jbtn { position: absolute; width: 45px; height: 45px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 8px; color: #fff; font-size: 20px; text-align: center; line-height: 45px; user-select: none; }
        .jup { left: 47px; top: 0; }
        .jdown { left: 47px; bottom: 0; }
        .jleft { left: 0; top: 47px; }
        .jright { right: 0; top: 47px; }

        #runBtn { position: absolute; bottom: 40px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 51, 51, 0.4); border: 3px solid #ff3333; color: #fff; font-weight: bold; display: none; align-items: center; justify-content: center; z-index: 20; }
        #lookZone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 15; display: none; }

        #actBtn { position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); padding: 15px 30px; background: #ffaa00; color: #000; border: 3px solid #fff; border-radius: 10px; font-weight: bold; font-size: 18px; display: none; z-index: 30; }
        
        #modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50; color: #fff; }
        .paper { background: #e8d5a5; color: #222; padding: 25px; border-radius: 5px; max-width: 80%; font-family: monospace; font-size: 16px; }
        #closeMod { margin-top: 20px; padding: 10px 20px; background: #ff3333; border: none; color: #fff; font-weight: bold; border-radius: 5px; }

        #win { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; }
        #win h1 { color: #ffaa00; font-size: 32px; margin-bottom: 15px; }
        #win button { padding: 12px 30px; background: #ffaa00; border: none; font-weight: bold; border-radius: 10px; font-size: 18px; }
    </style>
</head>
<body>

<div id="hud">Глава 1: Заброшенная фабрика</div>
<div id="task"></div>

<div id="lookZone"></div>

<div id="joy">
    <div class="jbtn jup" data-dir="up">▲</div>
    <div class="jbtn jdown" data-dir="down">▼</div>
    <div class="jbtn jleft" data-dir="left">◀</div>
    <div class="jbtn jright" data-dir="right">▶</div>
</div>

<div id="runBtn">БЕГ</div>
<button id="actBtn">ДЕЙСТВИЕ</button>

<div id="modal">
    <div class="paper">
        <h3>ЗАПИСКА</h3>
        <p>Найди 3 предохранителя, чтобы открыть дверь в конце коридора. Эксперимент 888 уже ждёт тебя...</p>
    </div>
    <button id="closeMod">ЗАКРЫТЬ</button>
</div>

<div id="win">
    <h1>ГЛАВА 1 ПРОЙДЕНА!</h1>
    <p>Вы выжили... на этот раз.</p>
    <button onclick="location.reload()">В МЕНЮ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

    var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 10); 
    camera.rotation.order = 'YXZ';

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    var sunLight = new THREE.DirectionalLight(0xffffff, 1);
    sunLight.position.set(10, 20, 10);
    scene.add(sunLight);

    // Улица и Фабрика
    var grass = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x4CAF50 }));
    grass.rotation.x = -Math.PI / 2; grass.position.y = -0.1; scene.add(grass);

    var road = new THREE.Mesh(new THREE.PlaneGeometry(6, 100), new THREE.MeshStandardMaterial({ color: 0x555555 }));
    road.rotation.x = -Math.PI / 2; scene.add(road);

    var factory = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 10), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
    factory.position.set(0, 4, -5); scene.add(factory);

    var door = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    door.position.set(0, 2, 0.1); scene.add(door);

    // Внутри
    var wallMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
    var floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a });

    var floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.position.z = -20; scene.add(floor);
    
    var ceil = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), wallMat);
    ceil.rotation.x = Math.PI / 2; ceil.position.y = 5; ceil.position.z = -20; scene.add(ceil);

    var lWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMat);
    lWall.rotation.y = Math.PI / 2; lWall.position.set(-5, 2.5, -20); scene.add(lWall);

    var rWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMat);
    rWall.rotation.y = -Math.PI / 2; rWall.position.set(5, 2.5, -20); scene.add(rWall);

    var bWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMat);
    bWall.position.set(0, 2.5, -40); scene.add(bWall);

    var light1 = new THREE.PointLight(0xffaa00, 1.5, 30); light1.position.set(0, 4, -10); scene.add(light1);
    var light2 = new THREE.PointLight(0xffaa00, 1.2, 30); light2.position.set(0, 4, -25); scene.add(light2);

    // Стол и Записка
    var boxMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
    var table = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), boxMat); table.position.set(-2, 1.0, -25); scene.add(table);
    var legGeo = new THREE.BoxGeometry(0.1, 1, 0.1);
    var legPos = [[-2.9, -24.6], [-1.1, -24.6], [-2.9, -25.4], [-1.1, -25.4]];
    legPos.forEach(function(p) {
        var leg = new THREE.Mesh(legGeo, boxMat);
        leg.position.set(p[0], 0.5, p[1]); scene.add(leg);
    });

    var noteMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.3), new THREE.MeshStandardMaterial({ color: 0xffff99, emissive: 0x333300 }));
    noteMesh.position.set(-2, 1.06, -25); scene.add(noteMesh);

    // Предохранители
    var fuseMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00 });
    var fuses = [];
    var fusePos = [[-3.5, -10], [3.5, -15], [-3.5, -30]];
    fusePos.forEach(function(p) {
        var f = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), fuseMat);
        f.position.set(p[0], 0.5, p[1]); scene.add(f); fuses.push(f);
    });
    var collected = 0;

    // Дверь в конце
    var endDoor = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    endDoor.position.set(0, 2, -39.8); scene.add(endDoor);
    var doorOpen = false;

    // Монстр
    var monster = new THREE.Group();
    var mBody = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
    mBody.position.y = 1; monster.add(mBody);
    var mHead = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), new THREE.MeshStandardMaterial({ color: 0xff9999 }));
    mHead.position.y = 2.5; monster.add(mHead);
    var eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
    var e1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); e1.position.set(-0.3, 2.6, 0.61); monster.add(e1);
    var e2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); e2.position.set(0.3, 2.6, 0.61); monster.add(e2);
    monster.position.set(-4, 0, -2); monster.visible = false; scene.add(monster);

    // Переменные
    var moveF = false, moveB = false, moveL = false, moveR = false, isRun = false;
    var speed = 3, runSpeed = 6;
    var inside = false, noteRead = false, mActive = false, won = false;

    function updateTask() {
        document.getElementById('task').innerText = "Предохранители: " + collected + "/3";
    }

    // Кнопки
    document.getElementById('joy').style.display = 'block';
    document.getElementById('lookZone').style.display = 'block';
    document.getElementById('runBtn').style.display = 'flex';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('task').style.display = 'block';
    updateTask();

    document.querySelectorAll('.jbtn').forEach(function(b) {
        var d = b.getAttribute('data-dir');
        b.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (d === 'up') moveF = true; if (d === 'down') moveB = true;
            if (d === 'left') moveL = true; if (d === 'right') moveR = true;
        }, {passive: false});
        b.addEventListener('touchend', function(e) {
            e.preventDefault();
            if (d === 'up') moveF = false; if (d === 'down') moveB = false;
            if (d === 'left') moveL = false; if (d === 'right') moveR = false;
        }, {passive: false});
    });

    var rBtn = document.getElementById('runBtn');
    rBtn.addEventListener('touchstart', function(e) { e.preventDefault(); isRun = true; }, {passive: false});
    rBtn.addEventListener('touchend', function(e) { e.preventDefault(); isRun = false; }, {passive: false});

    var look = document.getElementById('lookZone');
    var lx = 0, ly = 0;
    look.addEventListener('touchstart', function(e) { lx = e.touches[0].clientX; ly = e.touches[0].clientY; }, {passive: false});
    look.addEventListener('touchmove', function(e) {
        e.preventDefault();
        camera.rotation.y -= (e.touches[0].clientX - lx) * 0.005;
        camera.rotation.x -= (e.touches[0].clientY - ly) * 0.005;
        camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
        lx = e.touches[0].clientX; ly = e.touches[0].clientY;
    }, {passive: false});

    // Кнопка действия
    var actBtn = document.getElementById('actBtn');
    actBtn.addEventListener('click', function() {
        if (!inside && camera.position.z > 2) {
            inside = true; camera.position.set(0, 1.6, -2); actBtn.style.display = 'none';
        } else if (inside && !noteRead && Math.hypot(camera.position.x + 2, camera.position.z + 25) < 2) {
            document.getElementById('modal').style.display = 'flex'; noteRead = true; actBtn.style.display = 'none';
        } else if (inside && collected === 3 && !doorOpen && camera.position.z < -36) {
            doorOpen = true; endDoor.position.z = -39.9; mActive = true; monster.visible = true; actBtn.style.display = 'none';
        }
    });

    document.getElementById('closeMod').addEventListener('click', function() {
        document.getElementById('modal').style.display = 'none';
    });

    var clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        if (won) return;

        var delta = clock.getDelta();
        var sp = isRun ? runSpeed : speed;

        var dir = new THREE.Vector3();
        camera.getWorldDirection(dir);

        if (moveF) { camera.position.x += dir.x * sp * delta; camera.position.z += dir.z * sp * delta; }
        if (moveB) { camera.position.x -= dir.x * sp * delta; camera.position.z -= dir.z * sp * delta; }
        
        var right = new THREE.Vector3();
        right.crossVectors(camera.up, dir).normalize();
        if (moveL) { camera.position.x -= right.x * sp * delta; camera.position.z -= right.z * sp * delta; }
        if (moveR) { camera.position.x += right.x * sp * delta; camera.position.z += right.z * sp * delta; }

        // Ограничения
        if (!inside) {
            camera.position.x = Math.max(-4, Math.min(4, camera.position.x));
            camera.position.z = Math.max(1, Math.min(15, camera.position.z));
        } else {
            camera.position.x = Math.max(-4.5, Math.min(4.5, camera.position.x));
            camera.position.z = Math.max(-39, Math.min(-1, camera.position.z));
        }

        // Кнопка действия логика
        if (!inside && camera.position.z < 3) {
            actBtn.innerText = "🚪 ВОЙТИ"; actBtn.style.display = 'block';
        } else if (inside && !noteRead && Math.hypot(camera.position.x + 2, camera.position.z + 25) < 2) {
            actBtn.innerText = "📜 ПРОЧИТАТЬ"; actBtn.style.display = 'block';
        } else if (inside && collected === 3 && !doorOpen && camera.position.z < -36) {
            actBtn.innerText = "🔓 ОТКРЫТЬ ДВЕРЬ"; actBtn.style.display = 'block';
        } else {
            actBtn.style.display = 'none';
        }

        // Сбор
        if (inside && collected < 3) {
            for (var i = fuses.length - 1; i >= 0; i--) {
                var f = fuses[i];
                if (Math.hypot(camera.position.x - f.position.x, camera.position.z - f.position.z) < 1.5) {
                    scene.remove(f); fuses.splice(i, 1); collected++; updateTask();
                }
            }
        }

        // Победа
        if (inside && doorOpen && camera.position.z > -2) {
            won = true; document.getElementById('win').style.display = 'flex';
            document.getElementById('joy').style.display = 'none';
            document.getElementById('lookZone').style.display = 'none';
            document.getElementById('runBtn').style.display = 'none';
            document.getElementById('actBtn').style.display = 'none';
        }

        // Монстр
        if (mActive) {
            var mDir = new THREE.Vector3(camera.position.x - monster.position.x, 0, camera.position.z - monster.position.z).normalize();
            monster.position.x += mDir.x * 3.5 * delta;
            monster.position.z += mDir.z * 3.5 * delta;
            monster.lookAt(camera.position.x, 0, camera.position.z);
            if (Math.hypot(camera.position.x - monster.position.x, camera.position.z - monster.position.z) < 1.5) {
                alert("Вас поймал Мороженосчик!"); location.reload();
            }
        }

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
