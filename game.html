<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CreamTime</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial; touch-action:none; }
  canvas { display:block; }
  #hud { position:absolute; top:15px; left:15px; color:#fff; z-index:10; display:none; font-size:18px; font-weight:bold; }
  #task { position:absolute; top:45px; left:15px; color:#ffaa00; z-index:10; display:none; font-size:16px; font-weight:bold; }
  #joy { position:absolute; bottom:80px; left:30px; width:140px; height:140px; z-index:20; display:none; }
  .jbtn { position:absolute; width:45px; height:45px; background:rgba(255,255,255,0.2); border:2px solid #fff; border-radius:8px; color:#fff; font-size:20px; text-align:center; line-height:45px; user-select:none; }
  .jup { left:47px; top:0; } .jdown { left:47px; bottom:0; } .jleft { left:0; top:47px; } .jright { right:0; top:47px; }
  #runBtn { position:absolute; bottom:90px; right:30px; width:80px; height:80px; border-radius:50%; background:rgba(255,51,51,0.4); border:3px solid #ff3333; color:#fff; font-weight:bold; display:none; align-items:center; justify-content:center; z-index:20; }
  #look { position:absolute; top:0; right:0; width:50%; height:100%; z-index:15; display:none; }
  #actBtn { position:absolute; bottom:190px; left:50%; transform:translateX(-50%); padding:15px 30px; background:#ffaa00; color:#000; border:3px solid #fff; border-radius:10px; font-weight:bold; font-size:18px; display:none; z-index:30; }
</style>
</head>
<body>
<div id="hud">Глава 1: Заброшенная фабрика</div>
<div id="task">Предохранители: 0/3</div>
<div id="look"></div>
<div id="joy">
  <div class="jbtn jup" data-dir="up">▲</div>
  <div class="jbtn jdown" data-dir="down">▼</div>
  <div class="jbtn jleft" data-dir="left">◀</div>
  <div class="jbtn jright" data-dir="right">▶</div>
</div>
<div id="runBtn">БЕГ</div>
<button id="actBtn">ДЕЙСТВИЕ</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // СЮДА МЫ ВСТАВИМ КОД ИГРЫ В СЛЕДУЮЩЕМ СООБЩЕНИИ
</script>
</body>
</html>
