<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тест</title>
    <style>
        body { background: #111; color: white; font-family: Arial; text-align: center; padding-top: 50px; }
        .btn { padding: 20px; font-size: 24px; background: #ff3333; color: white; border: none; border-radius: 10px; margin-top: 20px; }
        .btn:active { background: #ff6666; }
        #hud { display: none; color: #ffaa00; font-size: 30px; }
    </style>
</head>
<body>
    <h1>CREAMTIME</h1>
    <button class="btn" onclick="start()">▶ ИГРАТЬ</button>
    
    <div id="hud">ИГРА ЗАПУЩЕНА!</div>

    <script>
        function start() {
            document.querySelector('.btn').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
        }
    </script>
</body>
</html>
