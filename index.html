<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CreamTime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background-color: #000; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0a0a 0%, #0a0a0a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 100;
        }
        #menu h1 { font-size: 52px; color: #ff3333; letter-spacing: 4px; text-shadow: 0 0 20px rgba(255, 51, 51, 0.6); margin-bottom: 5px; }
        #menu .subtitle { color: #888; font-size: 16px; margin-bottom: 40px; letter-spacing: 2px; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
        .menu-btn { padding: 15px; font-size: 20px; border: 2px solid #ff3333; background: rgba(255, 51, 51, 0.1); color: white; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .menu-btn:active { transform: scale(0.95); background: #ff3333; color: #000; }
        .menu-btn.secondary { border-color: #444; background: rgba(255,255,255,0.05); color: #aaa; }
        
        #hud { position: absolute; top: 20px; left: 20px; color: #aaa; pointer-events: none; text-shadow: 1px 1px 2px #000; z-index: 10; display: none; }
        
        #joystick { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; z-index: 20; display: none; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 5px; }
        .joy-btn { background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; user-select: none; pointer-events: auto; }
        .joy-btn:active { background: rgba(255, 255, 255, 0.4); }
        .joy-up { grid-column: 2; grid-row: 1; }
        .joy-left { grid-column: 1; grid-row: 2; }
        .joy-right { grid-column: 3; grid-row: 2; }
        .joy-down { grid-column: 2; grid-row: 3; }

        #runBtn { position: absolute; bottom: 50px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 51, 51, 0.3); border: 2px solid #ff3333; color: white; font-size: 14px; font-weight: bold; display: none; align-items: center; justify-content: center; z-index: 20; user-select: none; }
        #runBtn:active { background: rgba(255, 51, 51, 0.7); transform: scale(0.95); }

        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 15; display: none; }

        /* --- ИНТЕРФЕЙС ВЗАИМОДЕЙСТВИЯ --- */
        #actionBtn {
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #ffaa00; color: #000;
            border: 3px solid #fff; border-radius: 15px; font-weight: bold; font-size: 18px;
            display: none; z-index: 30; cursor: pointer;
        }
        
        #noteModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50; padding: 20px;
        }
        .note-paper {
            background: #e8d5a5; color: #222; padding: 30px; border-radius: 5px;
            max-width: 400px; width: 90%; font-size: 18px; line-height: 1.5;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); font-family: 'Courier New', monospace;
        }
        .note-paper h3 { margin-bottom: 15px; border-bottom: 1px solid #aaa; padding-bottom: 5px; text-align: center; }
        #closeNote { margin-top: 20px; padding: 10px 20px; background: #ff3333; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>CREAMTIME</h1>
        <div class="subtitle">ЧАСТЬ 1: ЗАБРОШЕННАЯ ФАБРИКА</div>
        <div class="menu-buttons">
            <button class="menu-btn" id="startBtn">▶ ИГРАТЬ</button>
            <button class="menu-btn secondary">⚙ НАСТРОЙКИ</button>
        </div>
    </div>

    <div id="hud">Глава 1: Заброшенная фабрика</div>
    <div id="look-zone"></div>
    <div id="joystick">
        <div class="joy-btn joy-up"    data-dir="up">▲</div>
        <div class="joy-btn joy-left"  data-dir="left">◀</div>
        <div class="joy-btn joy-right" data-dir="right">▶</div>
        <div class="joy-btn joy-down"  data-dir="down">▼</div>
    </div>
    <div id="runBtn">БЕГ</div>

    <!-- Кнопка действия (прочитать записку) -->
    <button id="actionBtn">📜 ПРОЧИТАТЬ</button>

    <!-- Модальное окно с запиской -->
    <div id="noteModal">
        <div class="note-paper">
            <h3>ЗАПИСКА ОТ НЕИЗВЕСТНОГО</h3>
            <p>Если ты это читаешь, значит, ты помнишь этот запах сладостей. Они всё ещё там, внизу. Эксперимент 888 уже ждёт тебя. Не заставляй его ждать слишком долго...</p>
        </div>
        <button id="closeNote">ЗАКРЫТЬ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 10, 35);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.display = 'none';
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const light1 = new THREE.PointLight(0xffaa00, 1.5, 30);
        light1.position.set(0, 4, 0); scene.add(light1);
        const light2 = new THREE.PointLight(0xffaa00, 1.2, 30);
        light2.position.set(0, 4, -15); scene.add(light2);
        const light3 = new THREE.PointLight(0xffaa00, 1.0, 30);
        light3.position.set(0, 4, -25); scene.add(light3);

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), floorMaterial);
        floor.rotation.x = -Math.PI / 2; floor.position.z = -10; scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), wallMaterial);
        ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 5; ceiling.position.z = -10; scene.add(ceiling);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-5, 2.5, -10); scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(5, 2.5, -10); scene.add(rightWall);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMaterial);
        backWall.position.set(0, 2.5, -30); scene.add(backWall);

        // --- СТОЛ С ЗАПИСКОЙ ---
        const tableMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), tableMat);
        tableTop.position.set(-2, 1.0, -5); scene.add(tableTop);
        const tableLeg1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 0.1), tableMat);
        tableLeg1.position.set(-2.8, 0.5, -4.6); scene.add(tableLeg1);
        const tableLeg2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 0.1), tableMat);
        tableLeg2.position.set(-1.2, 0.5, -4.6); scene.add(tableLeg2);
        const tableLeg3 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 0.1), tableMat);
        tableLeg3.position.set(-2.8, 0.5, -5.4); scene.add(tableLeg3);
        const tableLeg4 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1, 0.1), tableMat);
        tableLeg4.position.set(-1.2, 0.5, -5.4); scene.add(tableLeg4);

        const noteMat = new THREE.MeshStandardMaterial({ color: 0xffff99, emissive: 0x333300 });
        const noteMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.3), noteMat);
        noteMesh.position.set(-2, 1.06, -5); scene.add(noteMesh);

        // --- МОРОЖЕНОСЧИК (Эксперимент 888) ---
        const monsterGroup = new THREE.Group();
        
        // Тело (белое)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), bodyMat);
        body.position.y = 1; monsterGroup.add(body);

        // Голова (розовая)
        const headMat = new THREE.MeshStandardMaterial({ color: 0xff9999 });
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), headMat);
        head.position.y = 2.5; monsterGroup.add(head);

        // Глаза (черные)
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        eye1.position.set(-0.3, 2.6, 0.61); monsterGroup.add(eye1);
        const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat);
        eye2.position.set(0.3, 2.6, 0.61); monsterGroup.add(eye2);

        // Рот (черный)
        const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.1, 0.1), eyeMat);
        mouth.position.set(0, 2.3, 0.61); monsterGroup.add(mouth);

        // Рожок мороженого (коричневый)
        const coneMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 8), coneMat);
        cone.position.set(0, -0.5, 0); cone.rotation.x = Math.PI; monsterGroup.add(cone);

        monsterGroup.position.set(0, 0, -25); // Стоит в конце коридора
        monsterGroup.visible = false; // Пока скрыт, появится после записки
        scene.add(monsterGroup);

        // --- ЛОГИКА ИГРЫ ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isRunning = false;
        const walkSpeed = 3;
        const runSpeed = 6;
        
        let noteRead = false;
        let monsterActive = false;

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            renderer.domElement.style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('joystick').style.display = 'grid';
            document.getElementById('look-zone').style.display = 'block';
            document.getElementById('runBtn').style.display = 'flex';
            if (!renderer.isAnimating) { renderer.isAnimating = true; animate(); }
        });

        // Управление (стрелки)
        document.querySelectorAll('.joy-btn').forEach(btn => {
            const dir = btn.getAttribute('data-dir');
            const startMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = true;
                if (dir === 'down') moveBackward = true;
                if (dir === 'left') moveLeft = true;
                if (dir === 'right') moveRight = true;
            };
            const stopMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = false;
                if (dir === 'down') moveBackward = false;
                if (dir === 'left') moveLeft = false;
                if (dir === 'right') moveRight = false;
            };
            btn.addEventListener('touchstart', startMove, {passive: false});
            btn.addEventListener('touchend', stopMove, {passive: false});
            btn.addEventListener('touchcancel', stopMove, {passive: false});
        });

        // Бег
        const runBtn = document.getElementById('runBtn');
        runBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; runBtn.style.background = 'rgba(255, 51, 51, 0.8)'; }, {passive: false});
        runBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; runBtn.style.background = 'rgba(255, 51, 51, 0.3)'; }, {passive: false});

        // Камера
        const lookZone = document.getElementById('look-zone');
        let isLooking = false, lastX = 0, lastY = 0;
        lookZone.addEventListener('touchstart', (e) => { isLooking = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive: false});
        lookZone.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            e.preventDefault();
            const touch = e.touches[0];
            camera.rotation.y -= (touch.clientX - lastX) * 0.004;
            camera.rotation.x -= (touch.clientY - lastY) * 0.004;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            lastX = touch.clientX; lastY = touch.clientY;
        }, {passive: false});
        lookZone.addEventListener('touchend', () => { isLooking = false; });

        // Взаимодействие с запиской
        const actionBtn = document.getElementById('actionBtn');
        const noteModal = document.getElementById('noteModal');
        const closeNote = document.getElementById('closeNote');

        actionBtn.addEventListener('click', () => {
            noteModal.style.display = 'flex';
            actionBtn.style.display = 'none';
            noteRead = true;
            // Активируем монстра
            setTimeout(() => {
                monsterGroup.visible = true;
                monsterActive = true;
            }, 1000);
        });

        closeNote.addEventListener('click', () => {
            noteModal.style.display = 'none';
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const currentSpeed = isRunning ? runSpeed : walkSpeed;

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            if (moveForward) {
                camera.position.x += direction.x * currentSpeed * delta;
                camera.position.z += direction.z * currentSpeed * delta;
            }
            if (moveBackward) {
                camera.position.x -= direction.x * currentSpeed * delta;
                camera.position.z -= direction.z * currentSpeed * delta;
            }
            
            const right = new THREE.Vector3();
            right.crossVectors(camera.up, direction).normalize();
            
            if (moveLeft) {
                camera.position.x -= right.x * currentSpeed * delta;
                camera.position.z -= right.z * currentSpeed * delta;
            }
            if (moveRight) {
                camera.position.x += right.x * currentSpeed * delta;
                camera.position.z += right.z * currentSpeed * delta;
            }

            camera.position.x = Math.max(-4.5, Math.min(4.5, camera.position.x));
            camera.position.z = Math.max(-29, Math.min(4, camera.position.z));

            // Проверка близости к записке (координаты стола: x=-2, z=-5)
            if (!noteRead) {
                const distToNote = Math.sqrt(Math.pow(camera.position.x - (-2), 2) + Math.pow(camera.position.z - (-5), 2));
                if (distToNote < 2.5) {
                    actionBtn.style.display = 'block';
                } else {
                    actionBtn.style.display = 'none';
                }
            }

            // Движение монстра (если активен)
            if (monsterActive) {
                // Он медленно идёт к игроку
                const monsterDir = new THREE.Vector3(
                    camera.position.x - monsterGroup.position.x,
                    0,
                    camera.position.z - monsterGroup.position.z
                ).normalize();
                
                monsterGroup.position.x += monsterDir.x * 1.5 * delta;
                monsterGroup.position.z += monsterDir.z * 1.5 * delta;
                
                // Поворот монстра в сторону игрока
                monsterGroup.lookAt(camera.position.x, 0, camera.position.z);

                // Проверка на смерть (если слишком близко)
                const distToMonster = Math.sqrt(Math.pow(camera.position.x - monsterGroup.position.x, 2) + Math.pow(camera.position.z - monsterGroup.position.z, 2));
                if (distToMonster < 1.5) {
                    alert("Вас поймал Мороженосчик! Игра окончена.");
                    location.reload();
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
