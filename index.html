<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CreamTime v0.8</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { overflow:hidden; background:#000; font-family:Arial,sans-serif; touch-action:none; }
  canvas { display:block; }
  
  .screen {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(135deg, #0a0a0a 0%, #000 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; z-index:100;
  }
  .hidden { display:none !important; }
  
  h1 { font-size:52px; color:#ff3333; letter-spacing:4px; text-shadow:0 0 20px rgba(255,51,51,0.4); margin-bottom:5px; }
  .sub { color:#666; font-size:16px; margin-bottom:40px; letter-spacing:2px; }
  .btn { padding:15px; font-size:20px; border:2px solid #ff3333; background:rgba(255,51,51,0.1); color:white; border-radius:10px; font-weight:bold; cursor:pointer; width:80%; max-width:300px; margin-bottom:15px; }
  .btn:active { transform:scale(0.95); background:#ff3333; color:#000; }

  #hud { position:absolute; top:15px; left:15px; color:#ccc; z-index:10; display:none; text-shadow:1px 1px 3px #000; font-size:18px; font-weight:bold; }
  #task { position:absolute; top:45px; left:15px; color:#ffaa00; z-index:10; display:none; text-shadow:1px 1px 3px #000; font-size:16px; font-weight:bold; }
  
  #pauseBtn { position:absolute; top:15px; right:15px; padding:10px 15px; background:rgba(255,170,0,0.8); border:2px solid #fff; border-radius:10px; font-weight:bold; font-size:18px; display:none; z-index:30; cursor:pointer; }
  
  #joy { position:absolute; bottom:80px; left:30px; width:140px; height:140px; z-index:20; display:none; }
  .jbtn { position:absolute; width:45px; height:45px; background:rgba(255,255,255,0.15); border:2px solid #999; border-radius:8px; color:#ccc; font-size:20px; text-align:center; line-height:45px; user-select:none; }
  .jup { left:47px; top:0; } .jdown { left:47px; bottom:0; } .jleft { left:0; top:47px; } .jright { right:0; top:47px; }
  
  #runBtn { position:absolute; bottom:90px; right:30px; width:80px; height:80px; border-radius:50%; background:rgba(255,51,51,0.3); border:3px solid #ff3333; color:#fff; font-weight:bold; display:none; align-items:center; justify-content:center; z-index:20; }
  #look { position:absolute; top:0; right:0; width:50%; height:100%; z-index:15; display:none; }
  
  #actBtn { position:absolute; bottom:190px; left:50%; transform:translateX(-50%); padding:15px 30px; background:#ffaa00; color:#000; border:3px solid #fff; border-radius:10px; font-weight:bold; font-size:18px; display:none; z-index:30; }
  
  #modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; align-items:center; justify-content:center; z-index:50; flex-direction:column; }
  .paper { background:#e8d5a5; color:#222; padding:25px; border-radius:5px; max-width:80%; font-family:monospace; font-size:16px; }
  
  #win { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:100; color:#fff; }
</style>
</head>
<body>

<div id="menu" class="screen">
  <h1>CREAMTIME</h1>
  <p class="sub">ЧАСТЬ 1: ЗАБРОШЕННАЯ ФАБРИКА</p>
  <button class="btn" id="startBtn">▶ ИГРАТЬ</button>
</div>

<div id="pauseScreen" class="screen hidden">
  <h1 style="color:#ffaa00; margin-bottom:30px;">ПАУЗА</h1>
  <button class="btn" id="resumeBtn">▶ ПРОДОЛЖИТЬ</button>
  <button class="btn" id="exitBtn">🏠 В МЕНЮ</button>
</div>

<div id="hud">Глава 1: Заброшенная фабрика</div>
<div id="task">Предохранители: 0/3</div>
<button id="pauseBtn">⏸</button>

<div id="look"></div>
<div id="joy">
  <div class="jbtn jup" data-dir="up">▲</div>
  <div class="jbtn jdown" data-dir="down">▼</div>
  <div class="jbtn jleft" data-dir="left">◀</div>
  <div class="jbtn jright" data-dir="right">▶</div>
</div>
<div id="runBtn">БЕГ</div>
<button id="actBtn">ДЕЙСТВИЕ</button>

<div id="modal">
  <div class="paper">
    <h3>ЗАПИСКА</h3>
    <p>Найди 3 предохранителя, чтобы открыть дверь. Эксперимент 888 уже ждёт тебя...</p>
  </div>
  <button id="closeMod" style="margin-top:20px; padding:10px 20px; background:#ff3333; color:#fff; border:none; border-radius:5px;">ЗАКРЫТЬ</button>
</div>

<div id="win">
  <h1 style="color:#ffaa00; font-size:32px; margin-bottom:15px;">ГЛАВА 1 ПРОЙДЕНА!</h1>
  <button onclick="location.reload()" style="padding:12px 30px; background:#ffaa00; border:none; font-weight:bold; border-radius:10px; font-size:18px;">В МЕНЮ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a2a3a); 
  scene.fog = new THREE.Fog(0x1a2a3a, 15, 50); 

  var camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 10); camera.rotation.order = 'YXZ';

  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);

  // Свет
  var moonLight = new THREE.AmbientLight(0x444466, 0.6); scene.add(moonLight);
  var lampLight = new THREE.PointLight(0xffaa00, 2, 15); lampLight.position.set(0, 4, 2); scene.add(lampLight);
  var light1 = new THREE.PointLight(0xffaa00, 1, 25); light1.position.set(0, 4, -20); scene.add(light1);
  var light2 = new THREE.PointLight(0xff0000, 1, 25); light2.position.set(0, 4, -50); scene.add(light2);
  var light3 = new THREE.PointLight(0xffffff, 1, 25); light3.position.set(0, 4, -70); scene.add(light3);
  var light4 = new THREE.PointLight(0xff0000, 1.5, 30); light4.position.set(0, 4, -100); scene.add(light4); 

  // Текстуры
  var canvasFloor = document.createElement('canvas'); canvasFloor.width = 128; canvasFloor.height = 128;
  var ctxFloor = canvasFloor.getContext('2d'); ctxFloor.fillStyle = '#222'; ctxFloor.fillRect(0, 0, 128, 128); ctxFloor.strokeStyle = '#111'; ctxFloor.lineWidth = 4; ctxFloor.strokeRect(0, 0, 128, 128);
  var texFloor = new THREE.CanvasTexture(canvasFloor); texFloor.wrapS = texFloor.wrapT = THREE.RepeatWrapping; texFloor.repeat.set(10, 40);

  var canvasWall = document.createElement('canvas'); canvasWall.width = 128; canvasWall.height = 128;
  var ctxWall = canvasWall.getContext('2d'); ctxWall.fillStyle = '#2a2a2a'; ctxWall.fillRect(0, 0, 128, 128);
  for(var i=0; i<100; i++) { ctxWall.fillStyle = Math.random() > 0.5 ? '#222' : '#333'; ctxWall.fillRect(Math.random()*128, Math.random()*128, 2, 2); }
  var texWall = new THREE.CanvasTexture(canvasWall); texWall.wrapS = texWall.wrapT = THREE.RepeatWrapping; texWall.repeat.set(10, 5);

  var floorMat = new THREE.MeshStandardMaterial({ map: texFloor, roughness: 0.9 });
  var wallMat = new THREE.MeshStandardMaterial({ map: texWall, roughness: 0.9 });
  var doorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a1a, roughness: 0.7 });

  // Улица
  var grass = new THREE.Mesh(new THREE.PlaneGeometry(100,100), new THREE.MeshStandardMaterial({color:0x1a3a1a})); grass.rotation.x = -Math.PI/2; grass.position.y = -0.1; scene.add(grass);
  var road = new THREE.Mesh(new THREE.PlaneGeometry(6,100), new THREE.MeshStandardMaterial({color:0x222222})); road.rotation.x = -Math.PI/2; scene.add(road);
  var factory = new THREE.Mesh(new THREE.BoxGeometry(12,8,10), new THREE.MeshStandardMaterial({color:0x3a1a1a})); factory.position.set(0,4,-5); scene.add(factory);

  // Фонарь
  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshStandardMaterial({color:0x111})); pole.position.set(2, 2, 2); scene.add(pole);
  var lampHead = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color:0xffffaa, emissive:0xffaa00})); lampHead.position.set(2, 4, 2); scene.add(lampHead);

  // Вход
  var doorFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4,4.4,0.1), new THREE.MeshStandardMaterial({color:0x111})); doorFrame.position.set(0,2.2,0.05); scene.add(doorFrame);
  var frontDoor = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), doorMat); frontDoor.position.set(0,2,0.1); scene.add(frontDoor);
  var doorHandle = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshStandardMaterial({color:0x888})); doorHandle.position.set(0.7, 2, 0.25); scene.add(doorHandle);

  // КОМНАТА 1 (до -40)
  var floor1 = new THREE.Mesh(new THREE.PlaneGeometry(10,40), floorMat); floor1.rotation.x = -Math.PI/2; floor1.position.z = -20; scene.add(floor1);
  var lWall1 = new THREE.Mesh(new THREE.PlaneGeometry(40,5), wallMat); lWall1.rotation.y = Math.PI/2; lWall1.position.set(-5,2.5,-20); scene.add(lWall1);
  var rWall1 = new THREE.Mesh(new THREE.PlaneGeometry(40,5), wallMat); rWall1.rotation.y = -Math.PI/2; rWall1.position.set(5,2.5,-20); scene.add(rWall1);
  var ceil1 = new THREE.Mesh(new THREE.PlaneGeometry(10,40), wallMat); ceil1.rotation.x = Math.PI/2; ceil1.position.y = 5; ceil1.position.z = -20; scene.add(ceil1);

  // Стена 1 (проём)
  var wall1a = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall1a.position.set(-3,2.5,-40); scene.add(wall1a);
  var wall1b = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall1b.position.set(3,2.5,-40); scene.add(wall1b);
  var wall1Top = new THREE.Mesh(new THREE.BoxGeometry(2,1,0.2), wallMat); wall1Top.position.set(0,4.5,-40); scene.add(wall1Top);
  var endDoor = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), doorMat); endDoor.position.set(0,2,-40); scene.add(endDoor);

  // Стол и Записка
  var boxMat = new THREE.MeshStandardMaterial({color:0x2a1a1a});
  var table = new THREE.Mesh(new THREE.BoxGeometry(2,0.1,1), boxMat); table.position.set(-2,1.0,-25); scene.add(table);
  [[-2.9,-24.6],[-1.1,-24.6],[-2.9,-25.4],[-1.1,-25.4]].forEach(function(p){ var leg = new THREE.Mesh(new THREE.BoxGeometry(0.1,1,0.1), boxMat); leg.position.set(p[0],0.5,p[1]); scene.add(leg); });
  var note = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.02,0.3), new THREE.MeshStandardMaterial({color:0xffff99,emissive:0x333300})); note.position.set(-2,1.06,-25); scene.add(note);

  // Предохранители
  var fuseMat = new THREE.MeshStandardMaterial({color:0xffff00,emissive:0xffff00}); var fuses = [];
  [[-3.5,-10],[3.5,-15],[-3.5,-30]].forEach(function(p){ var f = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4), fuseMat); f.position.set(p[0],0.5,p[1]); scene.add(f); fuses.push(f); });
  var collected = 0;

  // КОМНАТА 2 (Статуя, от -40 до -65)
  var floor2 = new THREE.Mesh(new THREE.PlaneGeometry(10,25), floorMat); floor2.rotation.x = -Math.PI/2; floor2.position.z = -52.5; scene.add(floor2);
  var lWall2 = new THREE.Mesh(new THREE.PlaneGeometry(25,5), wallMat); lWall2.rotation.y = Math.PI/2; lWall2.position.set(-5,2.5,-52.5); scene.add(lWall2);
  var rWall2 = new THREE.Mesh(new THREE.PlaneGeometry(25,5), wallMat); rWall2.rotation.y = -Math.PI/2; rWall2.position.set(5,2.5,-52.5); scene.add(rWall2);
  var ceil2 = new THREE.Mesh(new THREE.PlaneGeometry(10,25), wallMat); ceil2.rotation.x = Math.PI/2; ceil2.position.y = 5; ceil2.position.z = -52.5; scene.add(ceil2);

  // Стена 2 (проём)
  var wall2a = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall2a.position.set(-3,2.5,-65); scene.add(wall2a);
  var wall2b = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall2b.position.set(3,2.5,-65); scene.add(wall2b);
  var wall2Top = new THREE.Mesh(new THREE.BoxGeometry(2,1,0.2), wallMat); wall2Top.position.set(0,4.5,-65); scene.add(wall2Top);
  var door2 = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), doorMat); door2.position.set(0,2,-65); scene.add(door2);

  // Ключ (в комнате 2)
  var key = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.5), new THREE.MeshStandardMaterial({color:0xffd700, emissive:0x333300}));
  key.position.set(3, 1.2, -55); scene.add(key);
  var keyTaken = false;

  // Статуя Мороженосчика (в комнате 2)
  var statue = new THREE.Group();
  var sBody = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshStandardMaterial({color:0xeeeeee})); sBody.position.y=1; statue.add(sBody);
  var sHead = new THREE.Mesh(new THREE.BoxGeometry(1.2,1,1.2), new THREE.MeshStandardMaterial({color:0xff9999})); sHead.position.y=2.5; statue.add(sHead);
  var eyeMat = new THREE.MeshStandardMaterial({color:0});
  var e1 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), eyeMat); e1.position.set(-0.3,2.6,0.61); statue.add(e1);
  var e2 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), eyeMat); e2.position.set(0.3,2.6,0.61); statue.add(e2);
  statue.position.set(-4,0,-45); scene.add(statue);

  // КОМНАТА 3 (Фабрика, от -65 до -95)
  var floor3 = new THREE.Mesh(new THREE.PlaneGeometry(10,30), floorMat); floor3.rotation.x = -Math.PI/2; floor3.position.z = -80; scene.add(floor3);
  var lWall3 = new THREE.Mesh(new THREE.PlaneGeometry(30,5), wallMat); lWall3.rotation.y = Math.PI/2; lWall3.position.set(-5,2.5,-80); scene.add(lWall3);
  var rWall3 = new THREE.Mesh(new THREE.PlaneGeometry(30,5), wallMat); rWall3.rotation.y = -Math.PI/2; rWall3.position.set(5,2.5,-80); scene.add(rWall3);
  var ceil3 = new THREE.Mesh(new THREE.PlaneGeometry(10,30), wallMat); ceil3.rotation.x = Math.PI/2; ceil3.position.y = 5; ceil3.position.z = -80; scene.add(ceil3);

  // Станок
  var machineBase = new THREE.Mesh(new THREE.BoxGeometry(2,1,1), new THREE.MeshStandardMaterial({color:0x444})); machineBase.position.set(0, 0.5, -75); scene.add(machineBase);
  var machineTop = new THREE.Mesh(new THREE.BoxGeometry(1.5,1,0.5), new THREE.MeshStandardMaterial({color:0x666})); machineTop.position.set(0, 1.5, -75); scene.add(machineTop);
  
  // Стол для сканирования
  var scanTable = new THREE.Mesh(new THREE.BoxGeometry(1.5,0.1,1), boxMat); scanTable.position.set(-3, 1.0, -85); scene.add(scanTable);
  [[-3.6,-84.6],[-2.4,-84.6],[-3.6,-85.4],[-2.4,-85.4]].forEach(function(p){ var leg = new THREE.Mesh(new THREE.BoxGeometry(0.1,1,0.1), boxMat); leg.position.set(p[0],0.5,p[1]); scene.add(leg); });

  // Игрушка
  var toy = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshStandardMaterial({color:0xff99cc}));
  toy.position.set(-3, 1.2, -85); toy.visible = false; scene.add(toy);

  // Стена 3 (проём)
  var wall3a = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall3a.position.set(-3,2.5,-95); scene.add(wall3a);
  var wall3b = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall3b.position.set(3,2.5,-95); scene.add(wall3b);
  var wall3Top = new THREE.Mesh(new THREE.BoxGeometry(2,1,0.2), wallMat); wall3Top.position.set(0,4.5,-95); scene.add(wall3Top);
  var door3 = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), doorMat); door3.position.set(0,2,-95); scene.add(door3);

  // КОМНАТА 4 (Маленькая, от -95 до -105)
  var floor4 = new THREE.Mesh(new THREE.PlaneGeometry(10,10), floorMat); floor4.rotation.x = -Math.PI/2; floor4.position.z = -100; scene.add(floor4);
  var lWall4 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); lWall4.rotation.y = Math.PI/2; lWall4.position.set(-5,2.5,-100); scene.add(lWall4);
  var rWall4 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); rWall4.rotation.y = -Math.PI/2; rWall4.position.set(5,2.5,-100); scene.add(rWall4);
  var ceil4 = new THREE.Mesh(new THREE.PlaneGeometry(10,10), wallMat); ceil4.rotation.x = Math.PI/2; ceil4.position.y = 5; ceil4.position.z = -100; scene.add(ceil4);

  // ВЕНТИЛЯЦИЯ (Узкий проход, от -105 до -115)
  var floor5 = new THREE.Mesh(new THREE.PlaneGeometry(2,10), floorMat); floor5.rotation.x = -Math.PI/2; floor5.position.z = -110; scene.add(floor5);
  var lWall5 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); lWall5.rotation.y = Math.PI/2; lWall5.position.set(-1,2.5,-110); scene.add(lWall5);
  var rWall5 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); rWall5.rotation.y = -Math.PI/2; rWall5.position.set(1,2.5,-110); scene.add(rWall5);
  var ceil5 = new THREE.Mesh(new THREE.PlaneGeometry(2,10), wallMat); ceil5.rotation.x = Math.PI/2; ceil5.position.y = 5; ceil5.position.z = -110; scene.add(ceil5);

  // Стена 4 (проём в конце вентиляции)
  var wall4a = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall4a.position.set(-3,2.5,-115); scene.add(wall4a);
  var wall4b = new THREE.Mesh(new THREE.BoxGeometry(4,5,0.2), wallMat); wall4b.position.set(3,2.5,-115); scene.add(wall4b);
  var wall4Top = new THREE.Mesh(new THREE.BoxGeometry(2,1,0.2), wallMat); wall4Top.position.set(0,4.5,-115); scene.add(wall4Top);

  // КОМНАТА 5 (Обрыв, от -115 до -145)
  var floor6a = new THREE.Mesh(new THREE.PlaneGeometry(10,15), floorMat); floor6a.rotation.x = -Math.PI/2; floor6a.position.set(0, 0, -122.5); scene.add(floor6a);
  var floor6b = new THREE.Mesh(new THREE.PlaneGeometry(10,15), floorMat); floor6b.rotation.x = -Math.PI/2; floor6b.position.set(0, 0, -137.5); scene.add(floor6b);
  var bridge = new THREE.Mesh(new THREE.PlaneGeometry(3,10), new THREE.MeshStandardMaterial({color:0x3a2a2a})); bridge.rotation.x = -Math.PI/2; bridge.position.set(0, 0.1, -130); scene.add(bridge);
  var lWall6 = new THREE.Mesh(new THREE.PlaneGeometry(30,5), wallMat); lWall6.rotation.y = Math.PI/2; lWall6.position.set(-5,2.5,-130); scene.add(lWall6);
  var rWall6 = new THREE.Mesh(new THREE.PlaneGeometry(30,5), wallMat); rWall6.rotation.y = -Math.PI/2; rWall6.position.set(5,2.5,-130); scene.add(rWall6);
  var ceil6 = new THREE.Mesh(new THREE.PlaneGeometry(10,30), wallMat); ceil6.rotation.x = Math.PI/2; ceil6.position.y = 5; ceil6.position.z = -130; scene.add(ceil6);
  var bWall6 = new THREE.Mesh(new THREE.PlaneGeometry(10,5), wallMat); bWall6.position.set(0,2.5,-145); scene.add(bWall6);

  // Выход (зеленая дверь)
  var exitDoorFrame = new THREE.Mesh(new THREE.BoxGeometry(2.4,4.4,0.1), new THREE.MeshStandardMaterial({color:0x111})); exitDoorFrame.position.set(0,2.2,-144.9); scene.add(exitDoorFrame);
  var exitDoor = new THREE.Mesh(new THREE.BoxGeometry(2,4,0.2), new THREE.MeshStandardMaterial({color:0x00aa00})); exitDoor.position.set(0,2,-144.8); scene.add(exitDoor);

  // Монстр (Появляется в комнате 4)
  var monster = new THREE.Group();
  var mBody = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshStandardMaterial({color:0xeeeeee})); mBody.position.y=1; monster.add(mBody);
  var mHead = new THREE.Mesh(new THREE.BoxGeometry(1.2,1,1.2), new THREE.MeshStandardMaterial({color:0xff9999})); mHead.position.y=2.5; monster.add(mHead);
  var e3 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), eyeMat); e3.position.set(-0.3,2.6,0.61); monster.add(e3);
  var e4 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.1), eyeMat); e4.position.set(0.3,2.6,0.61); monster.add(e4);
  monster.position.set(-4,0,-100); monster.visible=false; scene.add(monster);

  // Переменные
  var moveF=false, moveB=false, moveL=false, moveR=false, isRun=false;
  var speed=3, runSpeed=6, inside=false, won=false, cameraSens=0.005, mActive=false;
  var paused = false, noteRead = false, doorOpen = false;
  var room = 1, toyCreated = false, toyScanned = false;

  // UI
  document.getElementById('startBtn').onclick = function() {
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('hud').style.display = 'block';
    document.getElementById('task').style.display = 'block';
    document.getElementById('pauseBtn').style.display = 'block';
    document.getElementById('joy').style.display = 'block';
    document.getElementById('look').style.display = 'block';
    document.getElementById('runBtn').style.display = 'flex';
    animate();
  };

  document.getElementById('pauseBtn').onclick = function() { paused = true; document.getElementById('pauseScreen').classList.remove('hidden'); };
  document.getElementById('resumeBtn').onclick = function() { paused = false; document.getElementById('pauseScreen').classList.add('hidden'); };
  document.getElementById('exitBtn').onclick = function() { location.reload(); };

  document.querySelectorAll('.jbtn').forEach(function(b){
    var d = b.getAttribute('data-dir');
    b.addEventListener('touchstart', function(e){ e.preventDefault(); if(d==='up')moveF=true; if(d==='down')moveB=true; if(d==='left')moveL=true; if(d==='right')moveR=true; }, {passive:false});
    b.addEventListener('touchend', function(e){ e.preventDefault(); if(d==='up')moveF=false; if(d==='down')moveB=false; if(d==='left')moveL=false; if(d==='right')moveR=false; }, {passive:false});
  });

  var rBtn = document.getElementById('runBtn');
  rBtn.addEventListener('touchstart', function(e){ e.preventDefault(); isRun=true; }, {passive:false});
  rBtn.addEventListener('touchend', function(e){ e.preventDefault(); isRun=false; }, {passive:false});

  var look = document.getElementById('look'); var lx=0, ly=0;
  look.addEventListener('touchstart', function(e){ lx=e.touches[0].clientX; ly=e.touches[0].clientY; }, {passive:false});
  look.addEventListener('touchmove', function(e){
    e.preventDefault();
    camera.rotation.y -= (e.touches[0].clientX - lx) * cameraSens;
    camera.rotation.x -= (e.touches[0].clientY - ly) * cameraSens;
    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
    lx = e.touches[0].clientX; ly = e.touches[0].clientY;
  }, {passive:false});

  var actBtn = document.getElementById('actBtn');
  actBtn.onclick = function() {
    if(!inside && camera.position.z>2 && camera.position.z<7) { 
      inside=true; camera.position.set(0,1.6,-2); actBtn.style.display='none'; 
      document.getElementById('task').innerText = "Найди предохранители (0/3)";
    }
    else if(inside && !noteRead && Math.hypot(camera.position.x+2, camera.position.z+25)<3) {
      document.getElementById('modal').style.display='flex'; noteRead=true; actBtn.style.display='none';
    }
    else if(inside && collected===3 && !doorOpen && camera.position.z<-35) {
      doorOpen=true; endDoor.visible=false; 
      camera.position.set(0,1.6,-42); 
      room = 2;
      document.getElementById('task').innerText = "Найди ключ в комнате";
    }
    else if(room===2 && !keyTaken && Math.hypot(camera.position.x-3, camera.position.z+55)<2.5) {
      keyTaken = true; key.visible=false;
      document.getElementById('task').innerText = "Иди в комнату с фабрикой";
      door2.visible = false; // Дверь 2 открывается
    }
    else if(room===2 && keyTaken && camera.position.z<-63) {
      room = 3; camera.position.set(0,1.6,-67);
      document.getElementById('task').innerText = "Создай игрушку на станке";
    }
    else if(room===3 && !toyCreated && Math.hypot(camera.position.x, camera.position.z+75)<2.5) {
      toyCreated = true; toy.visible = true;
      document.getElementById('task').innerText = "Положи игрушку на стол и отсканируй";
    }
    else if(room===3 && toyCreated && !toyScanned && Math.hypot(camera.position.x+3, camera.position.z+85)<2.5) {
      toyScanned = true; toy.visible = false;
      document.getElementById('task').innerText = "Дверь открыта. Беги!";
      door3.visible=false; // Дверь 3 открывается
    }
    else if(room===3 && toyScanned && camera.position.z<-93) {
      room = 4; camera.position.set(0,1.6,-97);
      mActive = true; monster.visible = true; // Монстр появляется в комнате 4
      document.getElementById('task').innerText = "Беги в вентиляцию!";
    }
  };
  document.getElementById('closeMod').onclick = function() { document.getElementById('modal').style.display='none'; };

  var clock = new THREE.Clock();
  function animate() {
    if(won) return;
    requestAnimationFrame(animate);
    if(paused) return;
    
    var delta = clock.getDelta();
    var sp = isRun ? runSpeed : speed;
    var dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    var right = new THREE.Vector3(); right.crossVectors(camera.up, dir).normalize();

    var oldX = camera.position.x; var oldZ = camera.position.z;

    if(moveF){ camera.position.x+=dir.x*sp*delta; camera.position.z+=dir.z*sp*delta; }
    if(moveB){ camera.position.x-=dir.x*sp*delta; camera.position.z-=dir.z*sp*delta; }
    if(moveL){ camera.position.x-=right.x*sp*delta; camera.position.z-=right.z*sp*delta; }
    if(moveR){ camera.position.x+=right.x*sp*delta; camera.position.z+=right.z*sp*delta; }

    // Ограничения (общие)
    if(camera.position.z > 15 || camera.position.z < -144) camera.position.z = oldZ;

    // Ограничения X в зависимости от комнаты
    if(room===1 || room===2 || room===3) {
      if(camera.position.x > 4.5 || camera.position.x < -4.5) camera.position.x = oldX;
    } else if(room===4) {
      if(camera.position.x > 4.5 || camera.position.x < -4.5) camera.position.x = oldX;
    } else if(room===5) { // Вентиляция
      if(camera.position.x > 0.5 || camera.position.x < -0.5) camera.position.x = oldX;
    }

    // Обрыв (если упал в яму) в комнате 5
    if(room===5 && camera.position.z < -125 && camera.position.z > -135) {
      if (camera.position.x < -1.5 || camera.position.x > 1.5) { alert('Вы упали в обрыв!'); location.reload(); }
    }

    // Кнопки UI
    if(!inside && camera.position.z<7 && camera.position.z>2) { actBtn.innerText="🚪 ВОЙТИ"; actBtn.style.display='block'; }
    else if(inside && !noteRead && Math.hypot(camera.position.x+2, camera.position.z+25)<3) { actBtn.innerText="📜 ПРОЧИТАТЬ"; actBtn.style.display='block'; }
    else if(inside && collected===3 && !doorOpen && camera.position.z<-35) { actBtn.innerText="🔓 ОТКРЫТЬ ДВЕРЬ"; actBtn.style.display='block'; }
    else if(room===2 && !keyTaken && Math.hypot(camera.position.x-3, camera.position.z+55)<2.5) { actBtn.innerText="🔑 ВЗЯТЬ КЛЮЧ"; actBtn.style.display='block'; }
    else if(room===2 && keyTaken && camera.position.z<-63) { actBtn.innerText="🚪 ВОЙТИ"; actBtn.style.display='block'; }
    else if(room===3 && !toyCreated && Math.hypot(camera.position.x, camera.position.z+75)<2.5) { actBtn.innerText="⚙ СОЗДАТЬ ИГРУШКУ"; actBtn.style.display='block'; }
    else if(room===3 && toyCreated && !toyScanned && Math.hypot(camera.position.x+3, camera.position.z+85)<2.5) { actBtn.innerText="🔍 ОТСКАНИРОВАТЬ"; actBtn.style.display='block'; }
    else if(room===3 && toyScanned && camera.position.z<-93) { actBtn.innerText="🚪 ВОЙТИ"; actBtn.style.display='block'; }
    else { actBtn.style.display='none'; }

    // Сбор
    if(inside && room===1 && collected<3) {
      for(var i=fuses.length-1; i>=0; i--){
        var f = fuses[i];
        if(Math.hypot(camera.position.x-f.position.x, camera.position.z-f.position.z)<1.5) {
          scene.remove(f); fuses.splice(i,1); collected++;
          document.getElementById('task').innerText = "Предохранители: " + collected + "/3";
        }
      }
    }

    // Переход в комнату 5 (Вентиляция) из комнаты 4
    if(room===4 && camera.position.z < -105) {
      room = 5; camera.position.set(0, 1.6, -106);
    }

    // Финиш (Победа) в комнате 5
    if(room===5 && camera.position.z < -143) { 
      won = true; 
      document.getElementById('win').style.display='flex'; 
    }

    // Монстр
    if(mActive && monster.visible){
      var mDir = new THREE.Vector3(camera.position.x-monster.position.x, 0, camera.position.z-monster.position.z).normalize();
      monster.position.x += mDir.x * 2.5 * delta;
      monster.position.z += mDir.z * 2.5 * delta;
      monster.lookAt(camera.position.x, 0, camera.position.z);
      
      if (monster.position.z < -125 && monster.position.z > -135) {
        if (monster.position.x < -1.5 || monster.position.x > 1.5) {
            monster.visible = false; mActive = false;
            document.getElementById('task').innerText = "Мороженосчик упал! Бегите к выходу!";
            alert("Вы сбросили Мороженосчика в обрыв!");
        }
      }
      if(Math.hypot(camera.position.x-monster.position.x, camera.position.z-monster.position.z)<1.5) {
        alert("Вас поймал Мороженосчик!"); location.reload();
      }
    }
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
