<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CreamTime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background-color: #000; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        
        /* --- СТИЛИ МЕНЮ --- */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0a0a 0%, #0a0a0a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 100;
        }
        #menu h1 { font-size: 52px; color: #ff3333; letter-spacing: 4px; text-shadow: 0 0 20px rgba(255, 51, 51, 0.6); margin-bottom: 5px; }
        #menu .subtitle { color: #888; font-size: 16px; margin-bottom: 40px; letter-spacing: 2px; }
        
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
        .menu-btn {
            padding: 15px; font-size: 20px; border: 2px solid #ff3333;
            background: rgba(255, 51, 51, 0.1); color: white;
            border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .menu-btn:active { transform: scale(0.95); background: #ff3333; color: #000; }
        .menu-btn.secondary { border-color: #444; background: rgba(255,255,255,0.05); color: #aaa; }
        
        /* --- HUD --- */
        #hud { position: absolute; top: 20px; left: 20px; color: #aaa; pointer-events: none; text-shadow: 1px 1px 2px #000; z-index: 10; display: none; }

        /* --- ДЖОЙСТИК --- */
        #joystick {
            position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px;
            z-index: 20; display: none; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 5px;
        }
        .joy-btn {
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px; user-select: none; pointer-events: auto;
        }
        .joy-btn:active { background: rgba(255, 255, 255, 0.4); }
        .joy-up { grid-column: 2; grid-row: 1; }
        .joy-left { grid-column: 1; grid-row: 2; }
        .joy-right { grid-column: 3; grid-row: 2; }
        .joy-down { grid-column: 2; grid-row: 3; }

        /* --- КНОПКА БЕГА --- */
        #runBtn {
            position: absolute; bottom: 50px; right: 30px;
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255, 51, 51, 0.3); border: 2px solid #ff3333;
            color: white; font-size: 14px; font-weight: bold;
            display: none; align-items: center; justify-content: center;
            z-index: 20; user-select: none;
        }
        #runBtn:active { background: rgba(255, 51, 51, 0.7); transform: scale(0.95); }

        /* --- ЗОНА КАМЕРЫ --- */
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 15; display: none; }
    </style>
</head>
<body>

    <!-- МЕНЮ -->
    <div id="menu">
        <h1>CREAMTIME</h1>
        <div class="subtitle">ЧАСТЬ 1: ЗАБРОШЕННАЯ ФАБРИКА</div>
        <div class="menu-buttons">
            <button class="menu-btn" id="startBtn">▶ ИГРАТЬ</button>
            <button class="menu-btn secondary">⚙ НАСТРОЙКИ</button>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="hud">Глава 1: Заброшенная фабрика</div>
    <div id="look-zone"></div>
    <div id="joystick">
        <div class="joy-btn joy-up"    data-dir="up">▲</div>
        <div class="joy-btn joy-left"  data-dir="left">◀</div>
        <div class="joy-btn joy-right" data-dir="right">▶</div>
        <div class="joy-btn joy-down"  data-dir="down">▼</div>
    </div>
    <div id="runBtn">БЕГ</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // Сделали чуть светлее
        scene.fog = new THREE.Fog(0x1a1a1a, 10, 40); // Туман тоже посветлее и подальше

        // 2. Камера
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);
        camera.rotation.order = 'YXZ';

        // 3. Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.display = 'none';
        document.body.appendChild(renderer.domElement);

        // 4. СВЕТ (СТАЛО БОЛЬШЕ)
        scene.add(new THREE.AmbientLight(0xffffff, 0.4)); // Общий свет стал ярче (0.4 вместо 0.25)
        
        // Основная лампа на потолке
        const light1 = new THREE.PointLight(0xffaa00, 1.5, 30);
        light1.position.set(0, 4, 0);
        scene.add(light1);

        // Вторая лампа подальше, чтобы коридор не был тёмным
        const light2 = new THREE.PointLight(0xffaa00, 1.2, 30);
        light2.position.set(0, 4, -15);
        scene.add(light2);

        // Третья лампа в самом конце
        const light3 = new THREE.PointLight(0xffaa00, 1.0, 30);
        light3.position.set(0, 4, -25);
        scene.add(light3);

        // 5. КОРИДОР
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8 }); // Стены светлее
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -10;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), wallMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 5;
        ceiling.position.z = -10;
        scene.add(ceiling);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-5, 2.5, -10);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(5, 2.5, -10);
        scene.add(rightWall);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMaterial);
        backWall.position.set(0, 2.5, -30);
        scene.add(backWall);

        // 6. Управление
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isRunning = false;
        const walkSpeed = 3;
        const runSpeed = 6;

        // --- ЗАПУСК ---
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            renderer.domElement.style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('joystick').style.display = 'grid';
            document.getElementById('look-zone').style.display = 'block';
            document.getElementById('runBtn').style.display = 'flex';
            
            if (!renderer.isAnimating) {
                renderer.isAnimating = true;
                animate();
            }
        });

        // --- КНОПКИ ДВИЖЕНИЯ ---
        document.querySelectorAll('.joy-btn').forEach(btn => {
            const dir = btn.getAttribute('data-dir');
            const startMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = true;
                if (dir === 'down') moveBackward = true;
                if (dir === 'left') moveLeft = true;
                if (dir === 'right') moveRight = true;
            };
            const stopMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = false;
                if (dir === 'down') moveBackward = false;
                if (dir === 'left') moveLeft = false;
                if (dir === 'right') moveRight = false;
            };
            btn.addEventListener('touchstart', startMove, {passive: false});
            btn.addEventListener('touchend', stopMove, {passive: false});
            btn.addEventListener('touchcancel', stopMove, {passive: false});
            btn.addEventListener('mousedown', startMove);
            btn.addEventListener('mouseup', stopMove);
            btn.addEventListener('mouseleave', stopMove);
        });

        // --- КНОПКА БЕГА ---
        const runBtn = document.getElementById('runBtn');
        runBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; runBtn.style.background = 'rgba(255, 51, 51, 0.8)'; }, {passive: false});
        runBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; runBtn.style.background = 'rgba(255, 51, 51, 0.3)'; }, {passive: false});
        runBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); isRunning = false; runBtn.style.background = 'rgba(255, 51, 51, 0.3)'; }, {passive: false});

        // --- ПОВОРОТ КАМЕРЫ ---
        const lookZone = document.getElementById('look-zone');
        let isLooking = false, lastX = 0, lastY = 0;

        lookZone.addEventListener('touchstart', (e) => {
            isLooking = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        }, {passive: false});

        lookZone.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            e.preventDefault();
            const touch = e.touches[0];
            const deltaX = touch.clientX - lastX;
            const deltaY = touch.clientY - lastY;
            
            camera.rotation.y -= deltaX * 0.004; // Чуть замедлили для плавности
            camera.rotation.x -= deltaY * 0.004;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            
            lastX = touch.clientX;
            lastY = touch.clientY;
        }, {passive: false});

        lookZone.addEventListener('touchend', () => { isLooking = false; });

        // 7. Анимация
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const currentSpeed = isRunning ? runSpeed : walkSpeed;

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            if (moveForward) {
                camera.position.x += direction.x * currentSpeed * delta;
                camera.position.z += direction.z * currentSpeed * delta;
            }
            if (moveBackward) {
                camera.position.x -= direction.x * currentSpeed * delta;
                camera.position.z -= direction.z * currentSpeed * delta;
            }
            
            const right = new THREE.Vector3();
            right.crossVectors(camera.up, direction).normalize();
            
            if (moveLeft) {
                camera.position.x -= right.x * currentSpeed * delta;
                camera.position.z -= right.z * currentSpeed * delta;
            }
            if (moveRight) {
                camera.position.x += right.x * currentSpeed * delta;
                camera.position.z += right.z * currentSpeed * delta;
            }

            // Ограничения стен
            camera.position.x = Math.max(-4.5, Math.min(4.5, camera.position.x));
            camera.position.z = Math.max(-29, Math.min(4, camera.position.z));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
