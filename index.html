<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CreamTime</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background-color: #000; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
        
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0a0a 0%, #0a0a0a 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 100;
        }
        #menu h1 { font-size: 52px; color: #ff3333; letter-spacing: 4px; text-shadow: 0 0 20px rgba(255, 51, 51, 0.6); margin-bottom: 5px; }
        #menu .subtitle { color: #888; font-size: 16px; margin-bottom: 40px; letter-spacing: 2px; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
        .menu-btn { padding: 15px; font-size: 20px; border: 2px solid #ff3333; background: rgba(255, 51, 51, 0.1); color: white; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .menu-btn:active { transform: scale(0.95); background: #ff3333; color: #000; }
        .menu-btn.secondary { border-color: #444; background: rgba(255,255,255,0.05); color: #aaa; }
        
        #hud { position: absolute; top: 20px; left: 20px; color: #ccc; pointer-events: none; text-shadow: 1px 1px 3px #000; z-index: 10; display: none; font-size: 18px; font-weight: bold; }
        #task-hud { position: absolute; top: 50px; left: 20px; color: #ffaa00; pointer-events: none; text-shadow: 1px 1px 3px #000; z-index: 10; display: none; font-size: 16px; font-weight: bold; }
        
        #joystick { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; z-index: 20; display: none; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 5px; }
        .joy-btn { background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; user-select: none; pointer-events: auto; }
        .joy-btn:active { background: rgba(255, 255, 255, 0.4); }
        .joy-up { grid-column: 2; grid-row: 1; }
        .joy-left { grid-column: 1; grid-row: 2; }
        .joy-right { grid-column: 3; grid-row: 2; }
        .joy-down { grid-column: 2; grid-row: 3; }

        #runBtn { position: absolute; bottom: 50px; right: 30px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 51, 51, 0.3); border: 2px solid #ff3333; color: white; font-size: 14px; font-weight: bold; display: none; align-items: center; justify-content: center; z-index: 20; user-select: none; }
        #runBtn:active { background: rgba(255, 51, 51, 0.7); transform: scale(0.95); }

        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 15; display: none; }

        #actionBtn {
            position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: #ffaa00; color: #000;
            border: 3px solid #fff; border-radius: 15px; font-weight: bold; font-size: 18px;
            display: none; z-index: 30; cursor: pointer;
        }
        
        #noteModal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50; padding: 20px;
        }
        .note-paper {
            background: #e8d5a5; color: #222; padding: 30px; border-radius: 5px;
            max-width: 400px; width: 90%; font-size: 18px; line-height: 1.5;
            box-shadow: 0 0 20px rgba(0,0,0,0.8); font-family: 'Courier New', monospace;
        }
        .note-paper h3 { margin-bottom: 15px; border-bottom: 1px solid #aaa; padding-bottom: 5px; text-align: center; }
        #closeNote { margin-top: 20px; padding: 10px 20px; background: #ff3333; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }

        #winScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 200; color: white;
        }
        #winScreen h1 { color: #ffaa00; font-size: 42px; margin-bottom: 20px; text-shadow: 0 0 20px #ffaa00; }
        #winScreen p { font-size: 20px; margin-bottom: 30px; color: #aaa; }
        #winScreen button { padding: 15px 40px; font-size: 20px; background: #ffaa00; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>CREAMTIME</h1>
        <div class="subtitle">ЧАСТЬ 1: ЗАБРОШЕННАЯ ФАБРИКА</div>
        <div class="menu-buttons">
            <button class="menu-btn" id="startBtn">▶ ИГРАТЬ</button>
            <button class="menu-btn secondary">⚙ НАСТРОЙКИ</button>
        </div>
    </div>

    <div id="hud">Глава 1: Заброшенная фабрика</div>
    <div id="task-hud"></div>

    <div id="look-zone"></div>
    <div id="joystick">
        <div class="joy-btn joy-up"    data-dir="up">▲</div>
        <div class="joy-btn joy-left"  data-dir="left">◀</div>
        <div class="joy-btn joy-right" data-dir="right">▶</div>
        <div class="joy-btn joy-down"  data-dir="down">▼</div>
    </div>
    <div id="runBtn">БЕГ</div>

    <button id="actionBtn">ВЗАИМОДЕЙСТВОВАТЬ</button>

    <div id="noteModal">
        <div class="note-paper">
            <h3>ЗАПИСКА ОТ НЕИЗВЕСТНОГО</h3>
            <p>Найди 3 предохранителя, чтобы открыть дверь в конце коридора. Эксперимент 888 уже ждёт тебя...</p>
        </div>
        <button id="closeNote">ЗАКРЫТЬ</button>
    </div>

    <div id="winScreen">
        <h1>ГЛАВА 1 ПРОЙДЕНА!</h1>
        <p>Вы выжили... на этот раз. Продолжение следует...</p>
        <button onclick="location.reload()">В МЕНЮ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 10); 
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.display = 'none';
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        const grassMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
        const grass = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), grassMat);
        grass.rotation.x = -Math.PI / 2; grass.position.y = -0.1; scene.add(grass);

        const roadMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(6, 100), roadMat);
        road.rotation.x = -Math.PI / 2; road.position.y = 0; scene.add(road);

        const factoryMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const factory = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 10), factoryMat);
        factory.position.set(0, 4, -5); scene.add(factory);

        const doorMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const door = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.2), doorMat);
        door.position.set(0, 2, 0.1); scene.add(door);

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), floorMaterial);
        floor.rotation.x = -Math.PI / 2; floor.position.z = -20; floor.position.y = 0.01; scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(10, 40), wallMaterial);
        ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 5; ceiling.position.z = -20; scene.add(ceiling);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-5, 2.5, -20); scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(5, 2.5, -20); scene.add(rightWall);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMaterial);
        backWall.position.set(0, 2.5, -40); scene.add(backWall);

        const light1 = new THREE.PointLight(0xffaa00, 1.5, 30); light1.position.set(0, 4, -10); scene.add(light1);
        const light2 = new THREE.PointLight(0xffaa00, 1.2, 30); light2.position.set(0, 4, -25); scene.add(light2);

        const boxMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
        const crate1 = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), boxMat); crate1.position.set(-3, 0.5, -15); scene.add(crate1);
        const crate2 = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), boxMat); crate2.position.set(3, 0.75, -20); scene.add(crate2);

        const tableTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), boxMat); tableTop.position.set(-2, 1.0, -25); scene.add(tableTop);
        const legGeo = new THREE.BoxGeometry(0.1, 1, 0.1);
        const leg1 = new THREE.Mesh(legGeo, boxMat); leg1.position.set(-2.9, 0.5, -24.6); scene.add(leg1);
        const leg2 = new THREE.Mesh(legGeo, boxMat); leg2.position.set(-1.1, 0.5, -24.6); scene.add(leg2);
        const leg3 = new THREE.Mesh(legGeo, boxMat); leg3.position.set(-2.9, 0.5, -25.4); scene.add(leg3);
        const leg4 = new THREE.Mesh(legGeo, boxMat); leg4.position.set(-1.1, 0.5, -25.4); scene.add(leg4);

        const noteMat = new THREE.MeshStandardMaterial({ color: 0xffff99, emissive: 0x333300 });
        const noteMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.02, 0.3), noteMat);
        noteMesh.position.set(-2, 1.06, -25); scene.add(noteMesh);

        const fuseMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00 });
        const fuses = [];
        const fusePositions = [
            { x: -3.5, z: -10 },
            { x: 3.5, z: -15 },
            { x: -3.5, z: -30 }
        ];
        fusePositions.forEach(pos => {
            const fuse = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), fuseMat);
            fuse.position.set(pos.x, 0.5, pos.z);
            scene.add(fuse);
            fuses.push(fuse);
        });

        let collectedFuses = 0;

        const endDoorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const endDoor = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 0.2), endDoorMat);
        endDoor.position.set(0, 2, -39.8);
        scene.add(endDoor);
        let endDoorOpen = false;

        const monsterGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), bodyMat); body.position.y = 1; monsterGroup.add(body);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xff9999 });
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), headMat); head.position.y = 2.5; monsterGroup.add(head);
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
        const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); eye1.position.set(-0.3, 2.6, 0.61); monsterGroup.add(eye1);
        const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.1), eyeMat); eye2.position.set(0.3, 2.6, 0.61); monsterGroup.add(eye2);
        
        monsterGroup.position.set(-4, 0, -2); 
        monsterGroup.visible = false;
        scene.add(monsterGroup);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isRunning = false;
        const walkSpeed = 3;
        const runSpeed = 6;
        
        let playerInside = false;
        let noteRead = false;
        let monsterActive = false;
        let gameWon = false;

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            renderer.domElement.style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('task-hud').style.display = 'block';
            document.getElementById('joystick').style.display = 'grid';
            document.getElementById('look-zone').style.display = 'block';
            document.getElementById('runBtn').style.display = 'flex';
            if (!renderer.isAnimating) { renderer.isAnimating = true; animate(); }
            updateTask();
        });

        function updateTask() {
            document.getElementById('task-hud').innerText = `Предохранители: ${collectedFuses}/3`;
        }

        document.querySelectorAll('.joy-btn').forEach(btn => {
            const dir = btn.getAttribute('data-dir');
            const startMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = true;
                if (dir === 'down') moveBackward = true;
                if (dir === 'left') moveLeft = true;
                if (dir === 'right') moveRight = true;
            };
            const stopMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = false;
                if (dir === 'down') moveBackward = false;
                if (dir === 'left') moveLeft = false;
                if (dir === 'right') moveRight = false;
            };
            btn.addEventListener('touchstart', startMove, {passive: false});
            btn.addEventListener('touchend', stopMove, {passive: false});
            btn.addEventListener('touchcancel', stopMove, {passive: false});
        });

        const runBtn = document.getElementById('runBtn');
        runBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; runBtn.style.background = 'rgba(255, 51, 51, 0.8)'; }, {passive: false});
        runBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; runBtn.style.background = 'rgba(255, 51, 51, 0.3)'; }, {passive: false});

        const lookZone = document.getElementById('look-zone');
        let isLooking = false, lastX = 0, lastY = 0;
        lookZone.addEventListener('touchstart', (e) => { isLooking = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive: false});
        lookZone.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            e.preventDefault();
            const touch = e.touches[0];
            camera.rotation.y -= (touch.clientX - lastX) * 0.004;
            camera.rotation.x -= (touch.clientY - lastY) * 0.004;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            lastX = touch.clientX; lastY = touch.clientY;
        }, {passive: false});
        lookZone.addEventListener('touchend', () => { isLooking = false; });

        const actionBtn = document.getElementById('actionBtn');
        const noteModal = document.getElementById('noteModal');
        const closeNote = document.getElementById('closeNote');

        actionBtn.addEventListener('click', () => {
            if (!playerInside && camera.position.z > 2) {
                playerInside = true;
                actionBtn.style.display = 'none';
                camera.position.set(0, 1.6, -2);
            } 
            else if (playerInside && !noteRead && Math.sqrt(Math.pow(camera.position.x - (-2), 2) + Math.pow(camera.position.z - (-25), 2)) < 2) {
                noteModal.style.display = 'flex';
                actionBtn.style.display = 'none';
                noteRead = true;
                updateTask();
            }
            else if (playerInside && collectedFuses === 3 && !endDoorOpen && camera.position.z < -36) {
                endDoorOpen = true;
                endDoor.position.z = -39.9; 
                monsterActive = true;
                monsterGroup.visible = true;
                actionBtn.style.display = 'none';
            }
        });

        closeNote.addEventListener('click', () => {
            noteModal.style.display = 'none';
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            if (gameWon) return;

            const delta = clock.getDelta();
            const currentSpeed = isRunning ? runSpeed : walkSpeed;

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            if (moveForward) {
                camera.position.x += direction.x * currentSpeed * delta;
                camera.position.z += direction.z * currentSpeed * delta;
            }
            if (moveBackward) {
                camera.position.x -= direction.x * currentSpeed * delta;
                camera.position.z -= direction.z * currentSpeed * delta;
            }
            
            const right = new THREE.Vector3();
            right.crossVectors(camera.up, direction).normalize();
            
            if (moveLeft) {
                camera.position.x -= right.x * currentSpeed * delta;
                camera.position.z -= right.z * currentSpeed * delta;
            }
            if (moveRight) {
                camera.position.x += right.x * currentSpeed * delta;
                camera.position.z += right.z * currentSpeed * delta;
            }

            if (!playerInside) {
                camera.position.x = Math.max(-4, Math.min(4, camera.position.x));
                camera.position.z = Math.max(1, Math.min(15, camera.position.z));
            } else {
                camera.position.x = Math.max(-4.5, Math.min(4.5, camera.position.x));
                camera.position.z = Math.max(-39, Math.min(-1, camera.position.z));
            }

            if (playerInside && endDoorOpen && camera.position.z > -2) {
                gameWon = true;
                document.getElementById('winScreen').style.display = 'flex';
                document.getElementById('joystick').style.display = 'none';
                document.getElementById('look-zone').style.display = 'none';
                document.getElementById('runBtn').style.display = 'none';
                document.getElementById('actionBtn').style.display = 'none';
                document.getElementById('hud').style.display = 'none';
                document.getElementById('task-hud').style.display = 'none';
            }

            if (!playerInside && camera.position.z < 3) {
                actionBtn.innerText = "🚪 ВОЙТИ";
                actionBtn.style.display = 'block';
            } else if (playerInside && !noteRead && Math.sqrt(Math.pow(camera.position.x - (-2), 2) + Math.pow(camera.position.z - (-25), 2)) < 2) {
                actionBtn.innerText = "📜 ПРОЧИТАТЬ";
                actionBtn.style.display = 'block';
            } else if (playerInside && collectedFuses === 3 && !endDoorOpen && camera.position.z < -36) {
                actionBtn.innerText = "🔓 ОТКРЫТЬ ДВЕРЬ";
                actionBtn.style.display = 'block';
            } else {
                a
