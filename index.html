<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CreamTime - Chapter 1</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; touch-action: none; }
        canvas { display: block; }
        
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #aaa; pointer-events: none; text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }

        /* --- ВИРТУАЛЬНЫЕ КНОПКИ (СТРЕЛКИ) --- */
        #joystick {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            z-index: 20;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
        }

        .joy-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px; user-select: none;
            pointer-events: auto;
        }
        .joy-btn:active { background: rgba(255, 255, 255, 0.4); }

        /* Расстановка кнопок в сетке 3x3 */
        .joy-up    { grid-column: 2; grid-row: 1; }
        .joy-left  { grid-column: 1; grid-row: 2; }
        .joy-right { grid-column: 3; grid-row: 2; }
        .joy-down  { grid-column: 2; grid-row: 3; }

        /* --- ЗОНА ДЛЯ ПОВОРОТА КАМЕРЫ --- */
        #look-zone {
            position: absolute;
            top: 0; right: 0;
            width: 50%; height: 100%;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="hud">Глава 1: Заброшенная фабрика</div>

    <!-- Зона для поворота камеры -->
    <div id="look-zone"></div>

    <!-- Виртуальные стрелки -->
    <div id="joystick">
        <div class="joy-btn joy-up"    data-dir="up">▲</div>
        <div class="joy-btn joy-left"  data-dir="left">◀</div>
        <div class="joy-btn joy-right" data-dir="right">▶</div>
        <div class="joy-btn joy-down"  data-dir="down">▼</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.Fog(0x0a0a0a, 5, 30);

        // 2. Камера
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 5);
        camera.rotation.order = 'YXZ'; // Важно для правильного поворота

        // 3. Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Свет
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const light = new THREE.PointLight(0xffaa00, 1, 20);
        light.position.set(0, 4, 0);
        scene.add(light);

        // 5. Коридор
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });

        const floorGeo = new THREE.PlaneGeometry(10, 40);
        const floor = new THREE.Mesh(floorGeo, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -10;
        scene.add(floor);

        const ceiling = new THREE.Mesh(floorGeo, wallMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 5;
        ceiling.position.z = -10;
        scene.add(ceiling);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.position.set(-5, 2.5, -10);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), wallMaterial);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.position.set(5, 2.5, -10);
        scene.add(rightWall);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMaterial);
        backWall.position.set(0, 2.5, -30);
        scene.add(backWall);

        // 6. Управление
        const moveSpeed = 4; // Скорость движения
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        
        // Обработка виртуальных кнопок
        document.querySelectorAll('.joy-btn').forEach(btn => {
            const dir = btn.getAttribute('data-dir');
            
            const startMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = true;
                if (dir === 'down') moveBackward = true;
                if (dir === 'left') moveLeft = true;
                if (dir === 'right') moveRight = true;
            };
            
            const stopMove = (e) => {
                e.preventDefault();
                if (dir === 'up') moveForward = false;
                if (dir === 'down') moveBackward = false;
                if (dir === 'left') moveLeft = false;
                if (dir === 'right') moveRight = false;
            };
            
            btn.addEventListener('touchstart', startMove, {passive: false});
            btn.addEventListener('touchend', stopMove, {passive: false});
            btn.addEventListener('touchcancel', stopMove, {passive: false});
            btn.addEventListener('mousedown', startMove);
            btn.addEventListener('mouseup', stopMove);
            btn.addEventListener('mouseleave', stopMove);
        });

        // Обработка поворота камеры (свайп по правой части экрана)
        const lookZone = document.getElementById('look-zone');
        let isLooking = false;
        let lastX = 0;
        let lastY = 0;

        lookZone.addEventListener('touchstart', (e) => {
            isLooking = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        }, {passive: false});

        lookZone.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            e.preventDefault(); // Останавливаем скролл страницы
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - lastX;
            const deltaY = touch.clientY - lastY;
            
            // Скорость поворота
            camera.rotation.y -= deltaX * 0.005;
            camera.rotation.x -= deltaY * 0.005;
            
            // Ограничение, чтобы не сломать шею (вверх/вниз)
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            
            lastX = touch.clientX;
            lastY = touch.clientY;
        }, {passive: false});

        lookZone.addEventListener('touchend', () => {
            isLooking = false;
        });

        // 7. Анимация
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Вектор направления, куда смотрит камера
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            // Движение вперёд/назад (по направлению взгляда)
            if (moveForward) {
                camera.position.x += direction.x * moveSpeed * delta;
                camera.position.z += direction.z * moveSpeed * delta;
            }
            if (moveBackward) {
                camera.position.x -= direction.x * moveSpeed * delta;
                camera.position.z -= direction.z * moveSpeed * delta;
            }
            
            // Движение влево/вправо (перпендикулярно взгляду)
            const right = new THREE.Vector3();
            right.crossVectors(camera.up, direction).normalize();
            
            if (moveLeft) {
                camera.position.x -= right.x * moveSpeed * delta;
                camera.position.z -= right.z * moveSpeed * delta;
            }
            if (moveRight) {
                camera.position.x += right.x * moveSpeed * delta;
                camera.position.z += right.z * moveSpeed * delta;
            }

            // Ограничения (чтобы не пройти сквозь стены)
            camera.position.x = Math.max(-4.5, Math.min(4.5, camera.position.x));
            camera.position.z = Math.max(-29, Math.min(4, camera.position.z));

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
